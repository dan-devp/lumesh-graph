plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version "9.4.1"
}

group = 'dev.lumesh'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

def javaParserVersion = '3.28.1'
def neo4jDriverVersion = '6.1.0'
def picocliVersion = '4.7.7'
def jlineVersion = '3.27.1'

dependencies {
    implementation "com.github.javaparser:javaparser-symbol-solver-core:${javaParserVersion}"
    implementation "org.neo4j.driver:neo4j-java-driver:${neo4jDriverVersion}"
    implementation "info.picocli:picocli:${picocliVersion}"
    annotationProcessor "info.picocli:picocli-codegen:${picocliVersion}"
    implementation 'org.slf4j:slf4j-simple:2.0.17'
    implementation "org.jline:jline-terminal:${jlineVersion}"
    runtimeOnly "org.jline:jline-terminal-jansi:${jlineVersion}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'dev.lumesh.graph.Main'
}

compileJava {
    options.compilerArgs << "-Aproject=${project.group}/${project.name}"
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier = 'all'
    mergeServiceFiles()
}
